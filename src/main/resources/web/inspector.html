<!-- UI do AI Pipeline Inspector. React vendorizado (zero CDN, ADR-001 trava 1).
     Sem Babel de propósito: createElement dispensa transpilação em runtime e
     deixa este mesmo arquivo servir a superfície browser opcional. -->
<meta charset="utf-8">
<title>AI Pipeline Inspector</title>
<style>
html,body{height:100%;margin:0}
body{font:13px/1.45 "Segoe UI",system-ui,sans-serif;color:#1a1a19;background:#faf9f7}
#root{height:100%}
.wrap{display:flex;flex-direction:column;height:100vh}
.hdr{padding:10px 14px;border-bottom:1px solid #d3d1c7;background:#fff;flex:none}
.hdr h1{margin:0 0 4px;font-size:15px;font-weight:500}
.sum{color:#5f5e5a;font-size:12px}
.sum b{font-weight:500;color:#1a1a19}
.list{flex:1;overflow-y:auto;padding:8px 14px 20px}
.bx{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px;padding:8px 10px;border:1px solid;border-radius:6px}
.sq{flex:none;width:34px;color:#5f5e5a;font-variant-numeric:tabular-nums;font-size:11px;text-align:right}
.bd{flex:1;min-width:0}
.nm{font-weight:500}
.mt{color:#5f5e5a;font-size:11.5px;margin-top:2px;word-break:break-word}
.rt{flex:none;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px}
.chip{display:inline-block;padding:0 5px;border-radius:3px;font-size:10.5px;border:1px solid}
.ext{background:#E6F1FB;border-color:#185FA5;color:#0C447C}
.loc{background:#F1EFE8;border-color:#888780;color:#444441}
.st-failed{color:#A32D2D;font-weight:500}
.st-degraded{color:#854F0B;font-weight:500}
.empty{padding:20px 14px;color:#5f5e5a}
</style>
<div id="root"></div>
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script>
(function () {
  var h = React.createElement;
  var useState = React.useState;

  var PALETTE = {
    RAG:           { bg: "#E1F5EE", bd: "#0F6E56" },
    LLM:           { bg: "#EEEDFE", bd: "#534AB7" },
    HARNESS:       { bg: "#FAECE7", bd: "#993C1D" },
    DETERMINISTIC: { bg: "#F1EFE8", bd: "#5F5E5A" },
    DATABASE:      { bg: "#FAEEDA", bd: "#854F0B" },
    OBSERVABILITY: { bg: "#E6F1FB", bd: "#185FA5" },
    TOOL:          { bg: "#FBEAF0", bd: "#993556" }
  };
  var FALLBACK = { bg: "#fff", bd: "#B4B2A9" };

  function ms(v) { return (v === null || v === undefined) ? "—" : Math.round(v) + " ms"; }
  function secs(v) { return (v === null || v === undefined) ? "—" : (v / 1000).toFixed(2) + " s"; }

  function Box(props) {
    var b = props.box;
    var pal = PALETTE[b.category] || FALLBACK;
    var stCls = b.status === "failed" ? "st-failed"
              : b.status === "degraded" ? "st-degraded" : null;
    return h("div", {
      className: "bx",
      "data-category": b.category,
      "data-external": b.external ? "yes" : "no",
      style: { background: pal.bg, borderColor: pal.bd }
    },
      h("div", { className: "sq" }, b.seq),
      h("div", { className: "bd" },
        h("div", { className: "nm" }, b.name),
        h("div", { className: "mt" },
          h("span", { className: "chip " + (b.external ? "ext" : "loc") },
            b.external ? "HTTP externo" : "local"),
          " ", b.component || "—",
          b.detail ? " · " + b.detail : ""
        )
      ),
      h("div", { className: "rt" },
        h("div", { className: stCls }, b.status || "—"),
        h("div", { style: { color: "#5f5e5a" } }, ms(b.durationMs)),
        h("div", { style: { color: "#888780", fontSize: "10.5px" } },
          b.tPlusMs === null || b.tPlusMs === undefined ? "" : "t+" + (b.tPlusMs / 1000).toFixed(2) + "s")
      )
    );
  }

  function App() {
    var st = useState(null);
    var run = st[0], setRun = st[1];

    // A API e o flag ready sao instalados APOS a montagem, dentro do effect.
    // createRoot().render() no React 18 e assincrono: marcar ready logo depois
    // dele sinalizaria "pronto" enquanto loadRun ainda era o stub, e o Java
    // chamaria cedo. O flag precisa significar "montado", nao "agendado".
    React.useEffect(function () {
      window.inspector.loadRun = function (json) {
        setRun(JSON.parse(json));
      };
      window.inspector.appendEvent = function (json) {
        var ev = JSON.parse(json);
        setRun(function (prev) {
          if (!prev) return prev;
          var boxes = prev.boxes.concat([ev]);
          return Object.assign({}, prev, { boxes: boxes, eventCount: boxes.length });
        });
      };
      window.inspector.ready = true;
    }, []);

    if (!run) {
      return h("div", { className: "empty" }, "esperando a run do Java…");
    }
    var ext = run.boxes.filter(function (b) { return b.external; }).length;
    return h("div", { className: "wrap" },
      h("div", { className: "hdr" },
        h("h1", null, run.runId),
        h("div", { className: "sum" },
          h("b", null, run.eventCount), " eventos · ",
          h("b", null, run.spanCount), " spans · ",
          h("b", null, secs(run.durationMs)), " · terminal ",
          h("b", null, run.terminalStatus || "—"), " · ",
          h("b", null, ext), " chamadas HTTP externas · ", run.source
        )
      ),
      h("div", { className: "list", id: "list" },
        run.boxes.map(function (b, i) { return h(Box, { key: b.seq + "-" + i, box: b }); })
      )
    );
  }

  window.inspector = {
    ready: false,
    errors: [],
    loadRun: function () { throw new Error("UI ainda não montou"); },
    appendEvent: function () { throw new Error("UI ainda não montou"); },
    probe: function () {
      var out = {};
      try { out.reactVersion = React.version; } catch (e) { out.reactVersion = "ABSENT"; }
      try {
        var boxes = document.querySelectorAll(".bx");
        out.boxCount = boxes.length;
        var cats = {}, ext = 0, withDur = 0, withStatus = 0;
        for (var i = 0; i < boxes.length; i++) {
          var c = boxes[i].getAttribute("data-category") || "NULL";
          cats[c] = (cats[c] || 0) + 1;
          if (boxes[i].getAttribute("data-external") === "yes") ext++;
          var rt = boxes[i].querySelector(".rt");
          if (rt && rt.textContent.indexOf("ms") >= 0) withDur++;
          if (rt && rt.textContent.length > 2) withStatus++;
        }
        out.categories = cats;
        out.externalCalls = ext;
        out.boxesWithDuration = withDur;
        out.boxesWithStatus = withStatus;
        var pal = { RAG:1, LLM:1, HARNESS:1, DETERMINISTIC:1, DATABASE:1, OBSERVABILITY:1, TOOL:1 };
        var distinctColors = {};
        for (var i2 = 0; i2 < boxes.length; i2++) {
          distinctColors[getComputedStyle(boxes[i2]).backgroundColor] = 1;
        }
        out.distinctBoxColors = Object.keys(distinctColors).length;
      } catch (e) { out.boxErr = "" + e; }
      try {
        var l = document.getElementById("list");
        out.listScrollH = l.scrollHeight; out.listClientH = l.clientHeight;
        l.scrollTop = 300; out.listScrollTopAfterSet = l.scrollTop; l.scrollTop = 0;
      } catch (e) { out.scrollErr = "" + e; }
      try { out.headerRunId = document.querySelector(".hdr h1").textContent; } catch (e) {}
      out.errors = window.inspector.errors.slice(0, 10);
      return out;
    }
  };
  window.onerror = function (m, s, l, c) {
    window.inspector.errors.push("onerror: " + m + " @" + l + ":" + c);
    return false;
  };

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
